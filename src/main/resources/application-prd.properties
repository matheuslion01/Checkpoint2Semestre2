spring.application.name=checkpoint01-semestre2
server.port=8080

springdoc.swagger-ui.path=/

# Banco de dados - profile prd
# No profile prd a aplicação NÃO cria banco nem tabelas automaticamente.
spring.datasource.url=jdbc:mysql://${DB_SERVER_URL}:${DB_SERVER_PORT}/${DB_SCHEMA}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
